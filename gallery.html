<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diary of Feelings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Lora:ital,wght@0,400;0,500;1,400&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --wine:#2b1620;
    --wine-deep:#1c0f16;
    --paper:#fbf3ea;
    --rose:#d88c9a;
    --gold:#cda45e;
    --ink:#3a2430;
    --cream:#f3e6d8;
    --muted-rose:#b98a94;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}
  body{
    font-family:'Lora', serif;
    background:var(--wine);
    color:var(--cream);
    min-height:100vh;
  }
  body.locked{overflow:hidden; height:100vh;}

  h1,h2{font-family:'Playfair Display', serif; font-weight:600; margin:0;}

  /* ---------- GATE ---------- */
  .gate{
    position:fixed; inset:0; z-index:50;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:
      radial-gradient(ellipse at 50% 40%, #3a1f2b 0%, var(--wine) 55%, var(--wine-deep) 100%);
    text-align:center; padding:2rem;
    clip-path: circle(150% at 50% 50%);
    transition: clip-path 1.1s cubic-bezier(.65,0,.35,1);
  }
  .gate.entering{clip-path: circle(0% at 50% 50%);}
  .gate.hidden{display:none;}

  .gate-eyebrow{
    font-family:'Caveat', cursive; font-size:20px; color:var(--muted-rose);
    letter-spacing:0.02em; margin-bottom:6px;
  }
  .gate-title{
    font-size:clamp(30px,6vw,44px); color:var(--paper); font-style:italic;
    margin-bottom:10px;
  }
  .gate-sub{
    font-size:15px; color:var(--muted-rose); max-width:340px; line-height:1.6;
    margin-bottom:2.75rem;
  }

  .heart-btn{
    position:relative; width:96px; height:96px; border:none; background:none;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    margin-bottom:1.1rem;
  }
  .heart-btn svg{
    width:56px; height:56px; filter:drop-shadow(0 0 14px rgba(205,164,94,0.55));
    animation: beat 2.4s ease-in-out infinite;
  }
  .heart-ring{
    position:absolute; inset:0; border-radius:50%;
    border:1px solid rgba(216,140,154,0.4);
    animation: ring 2.4s ease-in-out infinite;
  }
  @keyframes beat{
    0%, 100%{ transform:scale(1); }
    15%{ transform:scale(1.12); }
    30%{ transform:scale(0.98); }
    45%{ transform:scale(1.08); }
  }
  @keyframes ring{
    0%{ transform:scale(0.85); opacity:0.7; }
    70%{ transform:scale(1.35); opacity:0; }
    100%{ transform:scale(1.35); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){
    .heart-btn svg, .heart-ring{ animation:none; }
    .gate{ transition: opacity 0.5s ease; }
    .gate.entering{ clip-path: circle(150% at 50% 50%); opacity:0; }
  }

  .enter-label{
    font-family:'Caveat', cursive; font-size:19px; color:var(--gold);
  }

  .gate-notice{
    margin-top:2.75rem; max-width:360px; font-size:12.5px; line-height:1.6;
    color:rgba(243,230,216,0.55); border-top:1px solid rgba(216,140,154,0.25);
    padding-top:1rem;
  }
  .gate-notice b{color:rgba(243,230,216,0.8); font-weight:600;}

  /* ---------- DIARY ---------- */
  .diary{
    max-width:600px; margin:0 auto; padding:3rem 1.5rem 4rem;
  }
  .diary-header{ text-align:center; margin-bottom:2.5rem; }
  .diary-header .gate-eyebrow{ color:var(--rose); }
  .diary-header h1{ font-size:clamp(28px,5vw,36px); color:var(--paper); font-style:italic; }
  .diary-header .rule{
    width:60px; height:1px; background:var(--gold); margin:14px auto 0; opacity:0.6;
  }

  .entry{
    background:var(--paper); color:var(--ink); border-radius:4px;
    margin-bottom:2.25rem; overflow:hidden;
    box-shadow:0 18px 40px rgba(0,0,0,0.35);
    position:relative;
  }
  .entry::before{
    content:''; position:absolute; left:0; top:0; bottom:0; width:6px;
    background:linear-gradient(var(--rose), var(--gold));
  }
  .entry img{ width:100%; display:block; max-height:440px; object-fit:cover; }
  .entry-body{ padding:18px 22px 20px 26px; }
  .entry-caption{
    font-family:'Caveat', cursive; font-size:19px; color:var(--muted-rose);
    margin-bottom:14px;
  }

  .reactions{ display:flex; gap:10px; margin-bottom:16px; }
  .reactions button{
    font-family:'Lora', serif; font-size:13.5px; padding:7px 14px; border-radius:20px;
    border:1px solid rgba(58,36,48,0.18); background:transparent; color:var(--ink);
    cursor:pointer; display:flex; align-items:center; gap:6px; transition:all 0.15s ease;
  }
  .reactions button:hover{ border-color:var(--rose); }
  .reactions button.active{ background:var(--rose); border-color:var(--rose); color:#fff; }
  .reactions button:disabled{ cursor:default; }

  .notes{ border-top:1px solid rgba(58,36,48,0.12); padding-top:14px; }
  .notes-label{
    font-family:'Caveat', cursive; font-size:16px; color:var(--muted-rose); margin-bottom:8px;
  }
  .note-row{ display:flex; gap:8px; }
  .note-row input{
    flex:1; padding:9px 12px; border-radius:8px; border:1px solid rgba(58,36,48,0.18);
    font-family:'Lora', serif; font-size:13.5px; background:#fff;
  }
  .note-row button{
    padding:9px 16px; border-radius:8px; border:none; background:var(--ink); color:var(--paper);
    font-family:'Lora', serif; font-size:13px; cursor:pointer;
  }
  .note-row button:disabled{ opacity:0.5; }
  .note-list{ margin-top:10px; display:flex; flex-direction:column; gap:6px; }
  .note-item{
    background:rgba(216,140,154,0.12); border-radius:8px; padding:7px 11px;
    font-size:13px; line-height:1.5; font-style:italic;
  }

  .status{ font-size:13px; color:var(--muted-rose); margin-top:8px; min-height:16px; }
</style>
</head>
<body class="locked">

<div class="gate" id="gate">
  <div class="gate-eyebrow">for the people closest to me</div>
  <h1 class="gate-title">Diary of Feelings</h1>
  <p class="gate-sub">A few pages I don't show most people. Step in gently.</p>

  <button class="heart-btn" id="viewBtn" aria-label="Enter">
    <span class="heart-ring"></span>
    <svg viewBox="0 0 24 24" fill="var(--rose)"><path d="M12 21s-7.5-4.6-10-9.3C0.3 7.9 2.2 4 6 4c2.1 0 3.6 1.1 4.5 2.4C11.4 5.1 12.9 4 15 4c3.8 0 5.7 3.9 4 7.7C19.5 16.4 12 21 12 21z"/></svg>
  </button>
  <div class="enter-label">tap the heart to step inside</div>

  <div class="gate-notice">
    <b>Welcome to my world of feelings.</b> When you enter, you experience the warmth of my feelings and dept....
  </div>
</div>

<div class="diary" id="diaryContent">
  <div class="diary-header">
    <div class="gate-eyebrow">you made it</div>
    <h1>a few pages, just for you</h1>
    <div class="rule"></div>
  </div>
  <div id="grid"></div>
  <div class="status" id="status" style="text-align:center;"></div>
</div>

<script>
// Photos are now picked up automatically from the "images" folder in your repo.
// Just upload a photo there and refresh the page — no editing needed here.
const REPO_OWNER = 'nradhakrishnap';
const REPO_NAME = 'Gallery';
const IMAGES_FOLDER = 'images';

async function fetchImages() {
  const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${IMAGES_FOLDER}`;
  try {
    const res = await fetch(url);
    if (!res.ok) return [];
    const data = await res.json();
    const exts = /\.(jpe?g|png|gif|webp)$/i;
    return data
      .filter(item => item.type === 'file' && exts.test(item.name))
      .map(item => ({
        id: item.name.replace(/[^a-zA-Z0-9]/g, '_'),
        src: item.download_url,
        name: item.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ')
      }));
  } catch (e) {
    console.error('Could not load images from repo', e);
    return [];
  }
}

const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwgJ7omhlT9_kX-ffSwW4aeum-h3FaS2ZZd1kz5NK-Tuxnlrz7Hra1wl_ZMiwVckf9TCg/exec';

async function getDeviceInfo() {
  const ua = navigator.userAgent;
  let os = 'Unknown OS';
  if (/android/i.test(ua)) os = 'Android';
  else if (/iphone|ipad|ipod/i.test(ua)) os = 'iOS';
  else if (/windows/i.test(ua)) os = 'Windows';
  else if (/mac os/i.test(ua)) os = 'Mac';
  else if (/linux/i.test(ua)) os = 'Linux';

  let browser = 'Unknown browser';
  if (/edg/i.test(ua)) browser = 'Edge';
  else if (/chrome/i.test(ua)) browser = 'Chrome';
  else if (/safari/i.test(ua)) browser = 'Safari';
  else if (/firefox/i.test(ua)) browser = 'Firefox';

  let model = '';
  try {
    if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
      const hints = await navigator.userAgentData.getHighEntropyValues(['model']);
      if (hints.model) model = hints.model;
    }
  } catch (e) {}

  const screenSize = `${window.screen.width}x${window.screen.height}`;
  return `${os}${model ? ' (' + model + ')' : ''}, ${browser}, screen ${screenSize}`;
}

function getVisitorId() {
  let id = localStorage.getItem('gallery_visitor_id');
  if (!id) {
    id = 'v-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10);
    localStorage.setItem('gallery_visitor_id', id);
  }
  return id;
}

async function getIp() {
  try {
    const res = await fetch('https://api.ipify.org?format=json');
    const data = await res.json();
    return data.ip || 'Unknown IP';
  } catch (e) {
    return 'Unknown IP';
  }
}

async function getLocationAndIp() {
  const ip = await getIp();
  let location = 'Unknown location';
  try {
    const res = await fetch('https://ipapi.co/json/');
    const data = await res.json();
    location = `${data.city || 'Unknown city'}, ${data.country_name || 'Unknown country'}`;
  } catch (e) {}
  return { location, ip };
}

async function logEvent(action, imageId, comment) {
  const device = await getDeviceInfo();
  const { location, ip } = await getLocationAndIp();
  const visitorId = getVisitorId();
  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ device, location, ip, visitorId, action, imageId: imageId || '', comment: comment || '' })
    });
  } catch (e) {
    console.error('Could not log event', e);
  }
}

async function buildGallery() {
  const grid = document.getElementById('grid');
  const IMAGES = await fetchImages();

  if (!IMAGES.length) {
    grid.innerHTML = `<p style="text-align:center; color:var(--muted-rose); font-style:italic;">No pages yet — add a photo to the "images" folder in the repo and refresh.</p>`;
    return;
  }

  IMAGES.forEach((img) => {
    const entry = document.createElement('div');
    entry.className = 'entry';
    entry.innerHTML = `
      <img src="${img.src}" alt="${img.name}">
      <div class="entry-body">
        <div class="entry-caption">${img.name}</div>
        <div class="reactions">
          <button class="likeBtn" data-id="${img.id}">🤍 This is me</button>
          <button class="dislikeBtn" data-id="${img.id}">🖤 Not quite</button>
        </div>
        <div class="notes">
          <div class="notes-label">leave me a note</div>
          <div class="note-row">
            <input type="text" class="commentInput" data-id="${img.id}" placeholder="say something...">
            <button class="commentBtn" data-id="${img.id}">Send</button>
          </div>
          <div class="note-list" data-list="${img.id}"></div>
        </div>
      </div>
    `;
    grid.appendChild(entry);
  });

  const reacted = {};

  grid.querySelectorAll('.likeBtn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      if (reacted[id]) return;
      reacted[id] = 'like';
      btn.classList.add('active');
      await logEvent('like', id);
    });
  });

  grid.querySelectorAll('.dislikeBtn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      if (reacted[id]) return;
      reacted[id] = 'dislike';
      btn.classList.add('active');
      await logEvent('dislike', id);
    });
  });

  grid.querySelectorAll('.commentBtn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      const input = grid.querySelector(`.commentInput[data-id="${id}"]`);
      const text = input.value.trim();
      if (!text) return;
      btn.disabled = true;
      await logEvent('comment', id, text);
      const list = grid.querySelector(`.note-list[data-list="${id}"]`);
      const item = document.createElement('div');
      item.className = 'note-item';
      item.textContent = text;
      list.appendChild(item);
      input.value = '';
      btn.disabled = false;
    });
  });
}

document.getElementById('viewBtn').addEventListener('click', async () => {
  const btn = document.getElementById('viewBtn');
  const status = document.getElementById('status');
  btn.disabled = true;

  const gate = document.getElementById('gate');
  gate.classList.add('entering');

  await logEvent('view');

  setTimeout(() => {
    gate.classList.add('hidden');
    document.body.classList.remove('locked');
  }, 1150);
});

buildGallery();
</script>
</body>
</html>

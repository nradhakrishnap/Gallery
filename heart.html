<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diary of Feelings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Lora:ital,wght@0,400;0,500;1,400&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --wine:#2b1620;
    --wine-deep:#1c0f16;
    --paper:#fbf3ea;
    --rose:#d88c9a;
    --gold:#cda45e;
    --ink:#3a2430;
    --cream:#f3e6d8;
    --muted-rose:#b98a94;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}
  body{
    font-family:'Lora', serif;
    background:var(--wine);
    color:var(--cream);
    min-height:100vh;
  }
  body.locked{overflow:hidden; height:100vh;}

  h1,h2{font-family:'Playfair Display', serif; font-weight:600; margin:0;}

  /* ---------- GATE ---------- */
  .gate{
    position:fixed; inset:0; z-index:50;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:
      radial-gradient(ellipse at 50% 40%, #3a1f2b 0%, var(--wine) 55%, var(--wine-deep) 100%);
    text-align:center; padding:2rem;
    clip-path: circle(150% at 50% 50%);
    transition: clip-path 1.1s cubic-bezier(.65,0,.35,1);
  }
  .gate.entering{clip-path: circle(0% at 50% 50%);}
  .gate.hidden{display:none;}

  .gate-eyebrow{
    font-family:'Caveat', cursive; font-size:20px; color:var(--muted-rose);
    letter-spacing:0.02em; margin-bottom:6px;
  }
  .gate-title{
    font-size:clamp(30px,6vw,44px); color:var(--paper); font-style:italic;
    margin-bottom:10px;
  }
  .gate-sub{
    font-size:15px; color:var(--muted-rose); max-width:340px; line-height:1.6;
    margin-bottom:2.75rem;
  }

  .heart-btn{
    position:relative; width:280px; height:280px; border:none; background:none;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    margin-bottom:1.1rem;
  }
  .heart-btn svg{
    width:280px; height:280px; filter:drop-shadow(0 0 14px rgba(205,164,94,0.55));
    animation: beat 2.4s ease-in-out infinite;
  }
  .heart-ring{
    position:absolute; inset:0; border-radius:50%;
    border:1px solid rgba(216,140,154,0.4);
    animation: ring 2.4s ease-in-out infinite;
  }
  @keyframes beat{
    0%, 100%{ transform:scale(1); }
    15%{ transform:scale(1.12); }
    30%{ transform:scale(0.98); }
    45%{ transform:scale(1.08); }
  }
  @keyframes ring{
    0%{ transform:scale(0.85); opacity:0.7; }
    70%{ transform:scale(1.35); opacity:0; }
    100%{ transform:scale(1.35); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){
    .heart-btn svg, .heart-ring{ animation:none; }
    .gate{ transition: opacity 0.5s ease; }
    .gate.entering{ clip-path: circle(150% at 50% 50%); opacity:0; }
  }

  .enter-label{
    font-family:'Caveat', cursive; font-size:19px; color:var(--gold);
  }

  .gate-notice{
    margin-top:2.75rem; max-width:360px; font-size:12.5px; line-height:1.6;
    color:rgba(243,230,216,0.55); border-top:1px solid rgba(216,140,154,0.25);
    padding-top:1rem;
  }
  .gate-notice b{color:rgba(243,230,216,0.8); font-weight:600;}

  /* ---------- DIARY ---------- */
  .diary{
    max-width:700px; margin:0 auto; padding:3rem 1.5rem 4rem;
  }
  .diary-header{ text-align:center; margin-bottom:2.5rem; }
  .diary-header .gate-eyebrow{ color:var(--rose); }
  .diary-header h1{ font-size:clamp(28px,5vw,36px); color:var(--paper); font-style:italic; }
  .diary-header .rule{
    width:60px; height:1px; background:var(--gold); margin:14px auto 0; opacity:0.6;
  }

  .entry{
    background:var(--paper); color:var(--ink); border-radius:4px;
    margin-bottom:2.25rem; overflow:hidden;
    box-shadow:0 18px 40px rgba(0,0,0,0.35);
    position:relative;
  }
  .entry::before{
    content:''; position:absolute; left:0; top:0; bottom:0; width:6px;
    background:linear-gradient(var(--rose), var(--gold));
  }
  .entry img{
    display:block; max-width:100%; max-height:78vh; width:auto; height:auto;
    object-fit:contain; cursor:zoom-in;
  }
  .image-wrap{
    position:relative; display:flex; align-items:center; justify-content:center;
    background:var(--wine-deep);
  }

  .img-nav-btn{
    position:absolute; top:50%; transform:translateY(-50%);
    width:42px; height:42px; border-radius:50%; border:none;
    background:rgba(28,15,22,0.28); color:rgba(251,243,234,0.55);
    font-size:18px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:all 0.18s ease; backdrop-filter:blur(2px);
  }
  .img-nav-btn:hover, .img-nav-btn:focus-visible{
    background:rgba(28,15,22,0.55); color:var(--paper); transform:translateY(-50%) scale(1.06);
  }
  .img-nav-btn:disabled{ opacity:0; pointer-events:none; }
  .img-nav-btn.prev{ left:10px; }
  .img-nav-btn.next{ right:10px; }

  .img-page-indicator{
    position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
    font-family:'Caveat', cursive; font-size:16px; color:rgba(251,243,234,0.85);
    background:rgba(28,15,22,0.4); padding:2px 12px; border-radius:12px;
    backdrop-filter:blur(2px);
  }

  .lightbox{
    position:fixed; inset:0; z-index:100; background:rgba(12,6,9,0.92);
    display:none; align-items:center; justify-content:center; padding:2rem;
    cursor:zoom-out;
  }
  .lightbox.open{ display:flex; }
  .lightbox img{
    max-width:100%; max-height:100%; object-fit:contain;
    box-shadow:0 20px 60px rgba(0,0,0,0.6); border-radius:2px;
  }
  .lightbox-close{
    position:absolute; top:18px; right:22px; width:38px; height:38px;
    border-radius:50%; border:1px solid rgba(251,243,234,0.3); background:rgba(28,15,22,0.5);
    color:var(--paper); font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .entry-body{ padding:18px 22px 20px 26px; }
  .entry-caption{
    font-family:'Caveat', cursive; font-size:19px; color:var(--muted-rose);
    margin-bottom:14px;
  }

  .reactions{ display:flex; gap:10px; margin-bottom:16px; }
  .reactions button{
    font-family:'Lora', serif; font-size:13.5px; padding:7px 14px; border-radius:20px;
    border:1px solid rgba(58,36,48,0.18); background:transparent; color:var(--ink);
    cursor:pointer; display:flex; align-items:center; gap:6px; transition:all 0.15s ease;
  }
  .reactions button:hover{ border-color:var(--rose); }
  .reactions button.active{ background:var(--rose); border-color:var(--rose); color:#fff; }
  .reactions button:disabled{ cursor:default; }

  .notes{ border-top:1px solid rgba(58,36,48,0.12); padding-top:14px; }
  .notes-label{
    font-family:'Caveat', cursive; font-size:16px; color:var(--muted-rose); margin-bottom:8px;
  }
  .note-row{ display:flex; gap:8px; }
  .note-row input{
    flex:1; padding:9px 12px; border-radius:8px; border:1px solid rgba(58,36,48,0.18);
    font-family:'Lora', serif; font-size:13.5px; background:#fff;
  }
  .note-row button{
    padding:9px 16px; border-radius:8px; border:none; background:var(--ink); color:var(--paper);
    font-family:'Lora', serif; font-size:13px; cursor:pointer;
  }
  .note-row button:disabled{ opacity:0.5; }
  .note-list{ margin-top:10px; display:flex; flex-direction:column; gap:6px; }
  .note-item{
    background:rgba(216,140,154,0.12); border-radius:8px; padding:7px 11px;
    font-size:13px; line-height:1.5; font-style:italic;
  }

  .status{ font-size:13px; color:var(--muted-rose); margin-top:8px; min-height:16px; }
</style>
</head>
<body class="locked">

<div class="gate" id="gate">
  <div class="gate-eyebrow">for the people closest to me</div>
  <h1 class="gate-title">Diary of Feelings</h1>
  <p class="gate-sub">A few pages I don't show most people. Step in gently.</p>

  <button class="heart-btn" id="viewBtn" aria-label="Enter">
    <span class="heart-ring"></span>
    <svg viewBox="0 0 24 24" fill="#e63946"><path d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0112 5.052 5.5 5.5 0 0116.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 01-4.244 3.17 15.247 15.247 0 01-.383.219l-.022.012-.007.004-.003.001a.752.752 0 01-.704 0l-.003-.001z"/></svg>
  </button>
  <div class="enter-label">tap the heart to step inside</div>

  <div class="gate-notice">
    </b>Welcome to my world of feelings. When you enter, you experience the warmth of my feelings and dept....
  </div>
</div>

<div class="diary" id="diaryContent">
  <div class="diary-header">
    <div class="gate-eyebrow">you made it</div>
    <h1>a few pages, just for you</h1>
    <div class="rule"></div>
  </div>
  <div id="grid"></div>
  <div class="status" id="status" style="text-align:center;"></div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
  <img src="" alt="" id="lightboxImg">
</div>

<script>
// Photos are now picked up automatically from the "images" folder in your repo.
// Just upload a photo there and refresh the page — no editing needed here.
const REPO_OWNER = 'nradhakrishnap';
const REPO_NAME = 'Gallery';
const IMAGES_FOLDER = 'images';

async function fetchImages() {
  const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${IMAGES_FOLDER}`;
  try {
    const res = await fetch(url);
    if (!res.ok) return [];
    const data = await res.json();
    const exts = /\.(jpe?g|png|gif|webp)$/i;
    return data
      .filter(item => item.type === 'file' && exts.test(item.name))
      .map(item => ({
        id: item.name.replace(/[^a-zA-Z0-9]/g, '_'),
        src: item.download_url,
        name: item.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ')
      }));
  } catch (e) {
    console.error('Could not load images from repo', e);
    return [];
  }
}

const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwgJ7omhlT9_kX-ffSwW4aeum-h3FaS2ZZd1kz5NK-Tuxnlrz7Hra1wl_ZMiwVckf9TCg/exec';

async function getDeviceInfo() {
  const ua = navigator.userAgent;
  let os = 'Unknown OS';
  if (/android/i.test(ua)) os = 'Android';
  else if (/iphone|ipad|ipod/i.test(ua)) os = 'iOS';
  else if (/windows/i.test(ua)) os = 'Windows';
  else if (/mac os/i.test(ua)) os = 'Mac';
  else if (/linux/i.test(ua)) os = 'Linux';

  let browser = 'Unknown browser';
  if (/edg/i.test(ua)) browser = 'Edge';
  else if (/chrome/i.test(ua)) browser = 'Chrome';
  else if (/safari/i.test(ua)) browser = 'Safari';
  else if (/firefox/i.test(ua)) browser = 'Firefox';

  let model = '';
  try {
    if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
      const hints = await navigator.userAgentData.getHighEntropyValues(['model']);
      if (hints.model) model = hints.model;
    }
  } catch (e) {}

  const screenSize = `${window.screen.width}x${window.screen.height}`;
  return `${os}${model ? ' (' + model + ')' : ''}, ${browser}, screen ${screenSize}`;
}

function getVisitorId() {
  let id = localStorage.getItem('gallery_visitor_id');
  if (!id) {
    id = 'v-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10);
    localStorage.setItem('gallery_visitor_id', id);
  }
  return id;
}

async function getIp() {
  try {
    const res = await fetch('https://api.ipify.org?format=json');
    const data = await res.json();
    return data.ip || 'Unknown IP';
  } catch (e) {
    return 'Unknown IP';
  }
}

async function getLocationAndIp() {
  const ip = await getIp();
  let location = 'Unknown location';
  try {
    const res = await fetch('https://ipapi.co/json/');
    const data = await res.json();
    location = `${data.city || 'Unknown city'}, ${data.country_name || 'Unknown country'}`;
  } catch (e) {}
  return { location, ip };
}

async function logEvent(action, imageId, comment) {
  const device = await getDeviceInfo();
  const { location, ip } = await getLocationAndIp();
  const visitorId = getVisitorId();
  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ device, location, ip, visitorId, action, imageId: imageId || '', comment: comment || '' })
    });
  } catch (e) {
    console.error('Could not log event', e);
  }
}

let IMAGES = [];
let currentIndex = 0;
const reacted = {};
const localComments = {};

function renderEntry(index) {
  const grid = document.getElementById('grid');
  const img = IMAGES[index];
  grid.innerHTML = `
    <div class="entry">
      <div class="image-wrap">
        <img src="${img.src}" alt="${img.name}" id="mainImg">
        <button class="img-nav-btn prev" id="prevBtn" aria-label="Previous">&#8592;</button>
        <button class="img-nav-btn next" id="nextBtn" aria-label="Next">&#8594;</button>
        ${IMAGES.length > 1 ? `<div class="img-page-indicator">${index + 1} / ${IMAGES.length}</div>` : ''}
      </div>
      <div class="entry-body">
        <div class="entry-caption">${img.name}</div>
        <div class="reactions">
          <button class="likeBtn" data-id="${img.id}">🤍 This is me</button>
          <button class="dislikeBtn" data-id="${img.id}">🖤 Not quite</button>
        </div>
        <div class="notes">
          <div class="notes-label">leave me a note</div>
          <div class="note-row">
            <input type="text" class="commentInput" data-id="${img.id}" placeholder="say something...">
            <button class="commentBtn" data-id="${img.id}">Send</button>
          </div>
          <div class="note-list" data-list="${img.id}"></div>
        </div>
      </div>
    </div>
  `;

  const mainImg = grid.querySelector('#mainImg');
  const prevBtn = grid.querySelector('#prevBtn');
  const nextBtn = grid.querySelector('#nextBtn');
  const likeBtn = grid.querySelector('.likeBtn');
  const dislikeBtn = grid.querySelector('.dislikeBtn');
  const commentInput = grid.querySelector('.commentInput');
  const commentBtn = grid.querySelector('.commentBtn');
  const noteList = grid.querySelector('.note-list');

  prevBtn.disabled = (index === 0);
  nextBtn.disabled = (index === IMAGES.length - 1);
  prevBtn.addEventListener('click', () => goTo(currentIndex - 1));
  nextBtn.addEventListener('click', () => goTo(currentIndex + 1));

  mainImg.addEventListener('click', () => openLightbox(img.src, img.name));

  if (reacted[img.id] === 'like') likeBtn.classList.add('active');
  if (reacted[img.id] === 'dislike') dislikeBtn.classList.add('active');

  (localComments[img.id] || []).forEach(text => {
    const item = document.createElement('div');
    item.className = 'note-item';
    item.textContent = text;
    noteList.appendChild(item);
  });

  likeBtn.addEventListener('click', async () => {
    if (reacted[img.id]) return;
    reacted[img.id] = 'like';
    likeBtn.classList.add('active');
    await logEvent('like', img.id);
  });

  dislikeBtn.addEventListener('click', async () => {
    if (reacted[img.id]) return;
    reacted[img.id] = 'dislike';
    dislikeBtn.classList.add('active');
    await logEvent('dislike', img.id);
  });

  commentBtn.addEventListener('click', async () => {
    const text = commentInput.value.trim();
    if (!text) return;
    commentBtn.disabled = true;
    await logEvent('comment', img.id, text);
    localComments[img.id] = localComments[img.id] || [];
    localComments[img.id].push(text);
    const item = document.createElement('div');
    item.className = 'note-item';
    item.textContent = text;
    noteList.appendChild(item);
    commentInput.value = '';
    commentBtn.disabled = false;
  });

  logEvent('view', img.id);
}

function openLightbox(src, alt) {
  const lightbox = document.getElementById('lightbox');
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightboxImg').alt = alt;
  lightbox.classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}
document.getElementById('lightbox').addEventListener('click', closeLightbox);
document.getElementById('lightboxClose').addEventListener('click', (e) => {
  e.stopPropagation();
  closeLightbox();
});
document.getElementById('lightboxImg').addEventListener('click', (e) => e.stopPropagation());
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeLightbox();
});

function goTo(index) {
  if (index < 0 || index >= IMAGES.length) return;
  currentIndex = index;
  renderEntry(currentIndex);
}

async function buildGallery() {
  IMAGES = await fetchImages();
  const grid = document.getElementById('grid');

  if (!IMAGES.length) {
    grid.innerHTML = `<p style="text-align:center; color:var(--muted-rose); font-style:italic;">No pages yet — add a photo to the "images" folder in the repo and refresh.</p>`;
  }
}

document.getElementById('viewBtn').addEventListener('click', async () => {
  const btn = document.getElementById('viewBtn');
  btn.disabled = true;

  const gate = document.getElementById('gate');
  gate.classList.add('entering');

  await galleryReady;
  if (IMAGES.length) renderEntry(currentIndex);

  setTimeout(() => {
    gate.classList.add('hidden');
    document.body.classList.remove('locked');
  }, 1150);
});

const galleryReady = buildGallery();
</script>
</body>
</html>
